<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4a9eff">
  <meta name="description" content="A lightweight music player with folder selection and playlist management">
  <title>Music Player</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect fill='%234a9eff' width='192' height='192'/><text x='96' y='110' font-size='100' fill='%231a1a1a' text-anchor='middle' dominant-baseline='middle' font-family='system-ui' font-weight='bold'>♪</text></svg>">
</head>

<body>
  <div class="player-container">
    <!-- Header with Folders button -->
    <header class="player-header">
      <button id="foldersBtn" class="folders-button" title="Open folder menu (press F)">📁 Folders</button>
    </header>

    <!-- Main Content Area -->
    <main class="player-main">
      <!-- Left Panel: File Selector + Library Browser -->
      <div class="left-panel">
        <library-browser></library-browser>
      </div>

      <!-- Right Panel: Playlist Component -->
      <playlist-view></playlist-view>
    </main>

    <!-- Player Controls (Bottom) -->
    <footer class="player-footer">
      <!-- Now Playing Info with Action Buttons -->
      <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; margin-bottom: 1rem;">
        <div id="nowPlayingInfo" class="now-playing-info">
          <div class="track-title" title="Click to scroll to track in playlist">No track selected</div>
          <div class="track-artist">Select a file to start</div>
        </div>
        <div style="display: flex; gap: 0.4rem; flex-shrink: 0;">
          <button id="likeTrackBtn" class="now-playing-btn" title="Add to Liked playlist" style="display: none;">★</button>
          <button id="addTrackBtn" class="now-playing-btn" title="Add to playlist" style="display: none;">+</button>
        </div>
      </div>

      <!-- Progress Bar -->
      <div id="progressBar" class="progress-bar-container">
        <div class="progress-bar">
          <div class="progress-fill"></div>
          <input
            type="range"
            class="seek-bar"
            min="0"
            max="100"
            value="0"
            aria-label="Seek bar"
          >
        </div>
        <div class="time-display">
          <span class="current-time">0:00</span>
          <span class="duration">0:00</span>
        </div>
      </div>

      <!-- Player Controls -->
      <div id="playerControls" class="player-controls">
        <div class="controls">
          <button class="control-btn shuffle-btn" aria-label="Toggle shuffle">
            🔀
          </button>
          <button class="control-btn prev-btn" aria-label="Previous track (Left Arrow)">
            ⏮
          </button>
          <button class="control-btn control-btn--primary play-btn" aria-label="Play/Pause (Space)">
            ►
          </button>
          <button class="control-btn next-btn" aria-label="Next track (Right Arrow)">
            ⏭
          </button>
          <button class="control-btn loop-btn" aria-label="Toggle loop">
            🔁
          </button>
        </div>
      </div>
    </footer>
  </div>

  <!-- Hidden audio element - the actual player -->
  <audio id="audioElement" crossorigin="anonymous"></audio>

  <!-- Loading Screen -->
  <div id="loadingScreen" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #1a1a1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    font-family: system-ui, -apple-system, sans-serif;
  ">
    <style>
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #333;
        border-top-color: #4a9eff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 1rem;
      }
      .loading-text {
        color: #e0e0e0;
        font-size: 0.95rem;
        margin-bottom: 0.5rem;
      }
      .loading-progress {
        color: #666;
        font-size: 0.8rem;
      }
    </style>
    <div class="loading-spinner"></div>
    <div class="loading-text">Music Player</div>
    <div class="loading-progress" id="loadingProgress">Initializing...</div>
  </div>

  <!-- Add to Playlist Modal -->
  <dialog id="playlistModal" style="
    background: #252525;
    border: 1px solid #444;
    border-radius: 8px;
    color: #e0e0e0;
    padding: 0;
    max-width: 400px;
  ">
    <style>
      #playlistModal::backdrop {
        background-color: rgba(0, 0, 0, 0.7);
      }
      #playlistModal h2 {
        margin: 0;
        padding: 1rem;
        border-bottom: 1px solid #444;
        font-size: 1rem;
      }
      #playlistModal .modal-content {
        padding: 1rem;
        max-height: 300px;
        overflow-y: auto;
      }
      #playlistModal .playlist-option {
        padding: 0.6rem;
        margin: 0.4rem 0;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.2s;
      }
      #playlistModal .playlist-option:hover {
        background: #2a2a2a;
        border-color: #555;
      }
      #playlistModal .new-playlist-input {
        width: 100%;
        padding: 0.6rem;
        margin: 0.6rem 0;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 4px;
        color: #e0e0e0;
        box-sizing: border-box;
      }
      #playlistModal .modal-buttons {
        display: flex;
        gap: 0.5rem;
        margin-top: 1rem;
      }
      #playlistModal button {
        flex: 1;
        padding: 0.6rem;
        background: #2a2a2a;
        border: 1px solid #444;
        border-radius: 4px;
        color: #e0e0e0;
        cursor: pointer;
        transition: all 0.2s;
      }
      #playlistModal button:hover {
        background: #333;
        border-color: #555;
      }
      #playlistModal button.create-btn {
        background: #4a9eff;
        border-color: #4a9eff;
        color: #000;
        font-weight: 600;
      }
      #playlistModal button.create-btn:hover {
        background: #5aafff;
        border-color: #5aafff;
      }
    </style>
    <h2>Add to Playlist</h2>
    <div class="modal-content">
      <input type="text" class="new-playlist-input" id="newPlaylistName" placeholder="Or create new playlist...">
      <div id="playlistList"></div>
    </div>
    <div class="modal-buttons" style="padding: 0 1rem 1rem;">
      <button type="button" class="create-btn" id="createPlaylistBtn">Create New</button>
      <button type="button" id="closePlaylistModal">Cancel</button>
    </div>
  </dialog>

  <!-- Folders Dialog -->
  <dialog id="foldersDialog" style="
    background: #252525;
    border: 1px solid #444;
    border-radius: 8px;
    color: #e0e0e0;
    padding: 0;
    max-width: 500px;
  ">
    <style>
      #foldersDialog::backdrop {
        background-color: rgba(0, 0, 0, 0.7);
      }
      #foldersDialog h2 {
        margin: 0;
        padding: 1rem;
        border-bottom: 1px solid #444;
        font-size: 1rem;
      }
      #foldersDialog .dialog-content {
        padding: 1rem;
        min-height: 150px;
        max-height: 400px;
        overflow-y: auto;
      }
      #foldersDialog .dialog-buttons {
        display: flex;
        gap: 0.5rem;
        padding: 0 1rem 1rem;
      }
      #foldersDialog button {
        flex: 1;
        padding: 0.6rem;
        background: #2a2a2a;
        border: 1px solid #444;
        border-radius: 4px;
        color: #e0e0e0;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 0.9rem;
      }
      #foldersDialog button:hover {
        background: #333;
        border-color: #555;
      }
      #foldersDialog button.primary {
        background: #4a9eff;
        border-color: #4a9eff;
        color: #000;
        font-weight: 600;
      }
      #foldersDialog button.primary:hover {
        background: #5aafff;
        border-color: #5aafff;
      }
    </style>
    <h2>Folder Management</h2>
    <div class="dialog-content">
      <div id="fileSelector" class="file-selector">
        <div class="file-selector-controls">
          <button class="folder-btn" aria-label="Select folder">
            📁 Select Folder
          </button>
          <button class="clear-btn" aria-label="Clear playlist">
            ✕ Clear
          </button>
          <div class="file-count">No files selected</div>
        </div>
      </div>
    </div>
    <div class="dialog-buttons">
      <button type="button" id="closeFoldersDialog">Close</button>
    </div>
  </dialog>

  <!-- Import all components -->
  <script src="db.js"></script>
  <script src="metadata.js"></script>
  <script src="components/now-playing.js"></script>
  <script src="components/progress-bar.js"></script>
  <script src="components/player-controls.js"></script>
  <script src="components/file-selector.js"></script>
  <script src="components/playlist-view.js"></script>
  <script src="components/library-browser.js"></script>

  <!-- Main app logic -->
  <script src="app.js"></script>
</body>

</html>
