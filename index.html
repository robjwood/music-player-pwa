<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="player-container">
    <file-selector></file-selector>

    <!-- Main Content Area -->
    <main class="player-main">
      <!-- Left Panel: File Selector + Library Browser -->
      <div class="left-panel">
        <library-browser></library-browser>
      </div>

      <!-- Right Panel: Playlist Component -->
      <playlist-view></playlist-view>
    </main>

    <!-- Player Controls (Bottom) -->
    <footer class="player-footer">
      <!-- Now Playing Info Component -->
      <now-playing-info></now-playing-info>

      <!-- Progress Bar Component -->
      <progress-bar></progress-bar>

      <!-- Player Controls Component -->
      <player-controls></player-controls>
    </footer>
  </div>

  <!-- Hidden audio element - the actual player -->
  <audio id="audioElement"></audio>

  <!-- Add to Playlist Modal -->
  <dialog id="playlistModal" style="
    background: #252525;
    border: 1px solid #444;
    border-radius: 8px;
    color: #e0e0e0;
    padding: 0;
    max-width: 400px;
  ">
    <style>
      #playlistModal::backdrop {
        background-color: rgba(0, 0, 0, 0.7);
      }
      #playlistModal h2 {
        margin: 0;
        padding: 1rem;
        border-bottom: 1px solid #444;
        font-size: 1rem;
      }
      #playlistModal .modal-content {
        padding: 1rem;
        max-height: 300px;
        overflow-y: auto;
      }
      #playlistModal .playlist-option {
        padding: 0.6rem;
        margin: 0.4rem 0;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.2s;
      }
      #playlistModal .playlist-option:hover {
        background: #2a2a2a;
        border-color: #555;
      }
      #playlistModal .new-playlist-input {
        width: 100%;
        padding: 0.6rem;
        margin: 0.6rem 0;
        background: #1a1a1a;
        border: 1px solid #333;
        border-radius: 4px;
        color: #e0e0e0;
        box-sizing: border-box;
      }
      #playlistModal .modal-buttons {
        display: flex;
        gap: 0.5rem;
        margin-top: 1rem;
      }
      #playlistModal button {
        flex: 1;
        padding: 0.6rem;
        background: #2a2a2a;
        border: 1px solid #444;
        border-radius: 4px;
        color: #e0e0e0;
        cursor: pointer;
        transition: all 0.2s;
      }
      #playlistModal button:hover {
        background: #333;
        border-color: #555;
      }
      #playlistModal button.create-btn {
        background: #4a9eff;
        border-color: #4a9eff;
        color: #000;
        font-weight: 600;
      }
      #playlistModal button.create-btn:hover {
        background: #5aafff;
        border-color: #5aafff;
      }
    </style>
    <h2>Add to Playlist</h2>
    <div class="modal-content">
      <input type="text" class="new-playlist-input" id="newPlaylistName" placeholder="Or create new playlist...">
      <div id="playlistList"></div>
    </div>
    <div class="modal-buttons" style="padding: 0 1rem 1rem;">
      <button type="button" class="create-btn" id="createPlaylistBtn">Create New</button>
      <button type="button" id="closePlaylistModal">Cancel</button>
    </div>
  </dialog>

  <!-- Import all components -->
  <script src="db.js"></script>
  <script src="metadata.js"></script>
  <script src="components/now-playing.js"></script>
  <script src="components/progress-bar.js"></script>
  <script src="components/player-controls.js"></script>
  <script src="components/file-selector.js"></script>
  <script src="components/playlist-view.js"></script>
  <script src="components/library-browser.js"></script>

  <!-- Main app logic -->
  <script src="app.js"></script>
</body>

</html>
